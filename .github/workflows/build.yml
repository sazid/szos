name: Build and publish image

on:
  push:
    branches:
      - main
    paths:
      - Containerfile
      - files/**
      - .github/workflows/build.yml
  workflow_dispatch:

env:
  DEFAULT_TAG: latest
  IMAGE_DESCRIPTION: "Sazid's personal bootc Open Image"
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Normalize image metadata
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_TAGS=${DEFAULT_TAG} sha-${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Containerfile before expensive steps
        run: |
          if ! grep -Eiq '^[[:space:]]*FROM[[:space:]]+[^[:space:]]+' Containerfile; then
            echo '::error file=Containerfile::Expected a container recipe with a FROM instruction, not workflow YAML.'
            exit 1
          fi

      - name: Free build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Build image with Podman
        run: |
          read -r -a tags <<< "$IMAGE_TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "localhost/${IMAGE_NAME}:${tag}")
          done

          sudo podman build \
            --format docker \
            "${tag_args[@]}" \
            --label "org.opencontainers.image.title=${IMAGE_NAME}" \
            --label "org.opencontainers.image.description=${IMAGE_DESCRIPTION}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "containers.bootc=1" \
            --file Containerfile .

      - name: Push image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | sudo podman login \
            --username "$GITHUB_ACTOR" --password-stdin "${IMAGE_REGISTRY%%/*}"
          read -r -a tags <<< "$IMAGE_TAGS"
          for tag in "${tags[@]}"; do
            sudo podman push "localhost/${IMAGE_NAME}:${tag}" \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done

      - name: Print image reference
        run: |
          echo "Published ${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
